appId: com.rpgbirthdaycard.game
productName: RPG Birthday Card
directories:
  output: dist-electron
files:
  - dist/**
  - electron/**
  - package.json
win:
  target: portable
  icon: electron/icon.png
  artifactName: RPG Birthday Card-v${version}.exe
mac:
  target: dmg
  icon: electron/icon.png
  artifactName: RPG Birthday Card-v${version}-${arch}.dmg
