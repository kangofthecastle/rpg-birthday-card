<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <!-- Placeholder cottage: bottom-center anchored, warm-gold accent (____). -->
  <!-- Soft ground shadow -->
  <ellipse cx="160" cy="348" rx="118" ry="16" fill="#000000" opacity="0.16"/>
  <!-- Chimney -->
  <rect x="206" y="86" width="30" height="60" fill="#b98a4b" stroke="#6f4f24" stroke-width="4"/>
  <!-- Roof (pentagon-ish gable) -->
  <polygon points="160,44 268,148 52,148" fill="#f2b64a" stroke="#8a5a1c" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="160,44 160,148 52,148" fill="#f7c766" opacity="0.55"/>
  <!-- Eave line -->
  <rect x="46" y="146" width="228" height="12" rx="4" fill="#c98f33"/>
  <!-- Walls -->
  <rect x="70" y="158" width="180" height="182" rx="6" fill="#fbeccb" stroke="#c99a54" stroke-width="6"/>
  <!-- Warm siding stripes -->
  <g opacity="0.5" stroke="#e8cf9c" stroke-width="3">
    <line x1="76" y1="192" x2="244" y2="192"/>
    <line x1="76" y1="228" x2="244" y2="228"/>
    <line x1="76" y1="264" x2="244" y2="264"/>
    <line x1="76" y1="300" x2="244" y2="300"/>
  </g>
  <!-- Windows -->
  <g>
    <rect x="92" y="192" width="46" height="46" rx="4" fill="#ffe9a8" stroke="#a9772f" stroke-width="5"/>
    <line x1="115" y1="192" x2="115" y2="238" stroke="#a9772f" stroke-width="4"/>
    <line x1="92" y1="215" x2="138" y2="215" stroke="#a9772f" stroke-width="4"/>
    <rect x="182" y="192" width="46" height="46" rx="4" fill="#ffe9a8" stroke="#a9772f" stroke-width="5"/>
    <line x1="205" y1="192" x2="205" y2="238" stroke="#a9772f" stroke-width="4"/>
    <line x1="182" y1="215" x2="228" y2="215" stroke="#a9772f" stroke-width="4"/>
  </g>
  <!-- Door -->
  <rect x="136" y="256" width="48" height="84" rx="6" fill="#d99b3c" stroke="#7d4e19" stroke-width="6"/>
  <circle cx="174" cy="300" r="4" fill="#ffe9a8"/>
  <!-- Step -->
  <rect x="126" y="336" width="68" height="10" rx="3" fill="#c99a54"/>
</svg>
